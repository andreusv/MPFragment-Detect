name: Build Executables (macOS & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - setup-windows-build
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows App with PyInstaller
        run: |
          python build_app.py

      - name: Package Windows Executable
        run: |
          powershell Compress-Archive -Path dist/MPFragment/* -DestinationPath MPFragment_Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPFragment_Windows
          path: MPFragment_Windows.zip

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App with PyInstaller
        run: |
          python build_app.py

      - name: Package macOS App
        run: |
          zip -r MPFragment_macOS.zip dist/MPFragment.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPFragment_macOS
          path: MPFragment_macOS.zip
